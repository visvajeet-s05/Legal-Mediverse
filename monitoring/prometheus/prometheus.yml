global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s

scrape_configs:
  - job_name: 'fastapi_escrow_indexer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']
        labels:
          environment: 'production'
          service: 'escrow-indexer'
          team: 'blockchain'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          environment: 'production'
          service: 'prometheus'
